name: SHIR Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shir-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Java 17 for current Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 4.4 build toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-30"             "build-tools;30.0.3"             "cmake;3.18.1"             "ndk;21.4.7075529"

      - name: Download pinned HT-Demucs 4-source model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          url="https://huggingface.co/ogbabydiesal/demucs-ggml/resolve/main/ggml-htdemucs-4s-f16.bin?download=true"
          out="app/src/main/assets/ggml-htdemucs-4s-f16.bin"
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o "$out"
          echo "72b17c42d308982ddb5069bc3bf48b81a5aac4cb6516e4366c0fa7cef6df0064  $out" | sha256sum -c -

      - name: Switch to Java 11 for Gradle 6.7.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.7.1

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -E "lib/(armeabi-v7a|x86)/libshir-native.so|assets/ggml-htdemucs-4s-f16.bin"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIR-Android-4.4.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
